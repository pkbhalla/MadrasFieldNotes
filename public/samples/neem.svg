<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#f1f8e9"/>
  <!-- Main stem/rachis -->
  <path d="M 60 350 Q 200 240 330 70" stroke="#558b2f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Leaflets pairs along rachis -->
  <!-- Pair 1 -->
  <path d="M 120 285 Q 90 270 70 290 Q 100 305 120 285 Z" fill="#33691e"/>
  <path d="M 130 280 Q 150 250 170 260 Q 150 290 130 280 Z" fill="#43a047"/>
  <!-- Pair 2 -->
  <path d="M 160 245 Q 120 225 100 245 Q 135 265 160 245 Z" fill="#33691e"/>
  <path d="M 170 240 Q 195 210 220 220 Q 200 250 170 240 Z" fill="#43a047"/>
  <!-- Pair 3 -->
  <path d="M 210 195 Q 170 175 150 195 Q 185 215 210 195 Z" fill="#33691e"/>
  <path d="M 220 190 Q 245 160 270 170 Q 250 200 220 190 Z" fill="#43a047"/>
  <!-- Pair 4 -->
  <path d="M 260 145 Q 225 125 205 145 Q 240 165 260 145 Z" fill="#33691e"/>
  <path d="M 270 140 Q 295 110 320 120 Q 300 150 270 140 Z" fill="#43a047"/>
  <!-- Terminal Leaflet -->
  <path d="M 330 70 Q 350 45 365 55 Q 355 85 330 70 Z" fill="#689f38"/>
  <!-- Neem fruit (yellow-green olive-like) -->
  <ellipse cx="140" cy="330" rx="9" ry="14" fill="#cddc39" transform="rotate(20 140 330)"/>
  <ellipse cx="160" cy="340" rx="9" ry="14" fill="#d4e157" transform="rotate(-15 160 340)"/>
  <text x="200" y="385" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b5e20">Neem Leaves (வேப்பம் இலைகள்)</text>
</svg>
