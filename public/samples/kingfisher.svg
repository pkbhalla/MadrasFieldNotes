<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#e0f7fa"/>
  <!-- Wire/Perch -->
  <line x1="30" y1="280" x2="370" y2="280" stroke="#424242" stroke-width="6"/>
  <!-- Turquoise Blue Back & Tail -->
  <path d="M 170 190 Q 140 260 130 330 L 160 330 Q 185 270 200 210 Z" fill="#00acc1"/>
  <!-- Chocolate Brown Body -->
  <ellipse cx="190" cy="220" rx="38" ry="50" fill="#4e342e"/>
  <!-- White Throat & Breast Patch -->
  <ellipse cx="215" cy="210" rx="18" ry="26" fill="#ffffff"/>
  <!-- Head (Chocolate Brown) -->
  <circle cx="210" cy="155" r="30" fill="#4e342e"/>
  <!-- Eye -->
  <circle cx="218" cy="150" r="5" fill="#212121"/>
  <!-- Long Dagger-like Red Beak -->
  <path d="M 230 148 L 330 162 L 230 168 Z" fill="#c62828"/>
  <text x="200" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#006064">White-throated Kingfisher (நீலம்பொருவி)</text>
</svg>
