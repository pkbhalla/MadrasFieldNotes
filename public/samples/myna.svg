<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#f1f8e9"/>
  <!-- Grass ground -->
  <path d="M 0 320 Q 200 310 400 320 L 400 400 L 0 400 Z" fill="#7cb342"/>
  <!-- Myna legs -->
  <line x1="180" y1="280" x2="175" y2="340" stroke="#fbc02d" stroke-width="5"/>
  <line x1="210" y1="280" x2="215" y2="340" stroke="#fbc02d" stroke-width="5"/>
  <!-- Tail -->
  <path d="M 130 260 L 90 290 L 105 305 L 150 270 Z" fill="#212121"/>
  <!-- Body (Brown) -->
  <ellipse cx="190" cy="235" rx="50" ry="40" fill="#5d4037"/>
  <!-- Black Head/Hood -->
  <circle cx="230" cy="180" r="32" fill="#212121"/>
  <!-- Bare Yellow Eye Patch (key identifying feature) -->
  <path d="M 235 170 Q 255 170 252 185 Q 238 190 235 170 Z" fill="#fbc02d"/>
  <circle cx="242" cy="178" r="4" fill="#212121"/>
  <!-- Yellow Beak -->
  <path d="M 255 175 L 295 186 L 255 195 Z" fill="#fbc02d"/>
  <text x="200" y="45" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#33691e">Common Myna (சாத்தைக்குருவி)</text>
</svg>
